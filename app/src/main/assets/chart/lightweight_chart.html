<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    #chart { width: 100%; height: 100%; }
  </style>
  <!-- Lightweight Charts 5.2.1 (Apache-2.0), di-bundle lokal: tidak butuh CDN -->
  <script src="lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div id="chart"></div>
  <script>
    let chart, candleSeries, volumeSeries;
    let emaSeries, bbUpper, bbLower, bbMiddle;
    let stochK, stochD;
    let ready = false;
    let currentRaw = [];
    let priceLines = [];
    let currentConfig = { volume: true, ema: false, bb: false, stoch: false };

    // Laporkan error ke Android (Logcat). Tanpa ini error JS hilang diam-diam.
    function report(where, err) {
      try {
        if (window.ChartBridge && ChartBridge.onError) {
          ChartBridge.onError(where + ': ' + ((err && err.message) ? err.message : String(err)));
        }
      } catch (_) {}
    }
    window.addEventListener('error', (e) => report('js', e.error || e.message));

    function init() {
      try {
        const el = document.getElementById('chart');
        chart = LightweightCharts.createChart(el, {
          layout: {
            background: { type: 'solid', color: 'transparent' },
            textColor: '#8b949e',
            fontSize: 11
          },
          grid: {
            vertLines: { color: 'rgba(255,255,255,0.04)' },
            horzLines: { color: 'rgba(255,255,255,0.04)' }
          },
          crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
          rightPriceScale: { borderColor: 'rgba(255,255,255,0.08)' },
          timeScale: {
            borderColor: 'rgba(255,255,255,0.08)',
            timeVisible: true,
            secondsVisible: false
          },
          handleScroll: { vertTouchDrag: false }
        });

        // v5: series dibuat lewat chart.addSeries(definisi, opsi)
        candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
          upColor: '#26a69a', downColor: '#ef5350',
          borderUpColor: '#26a69a', borderDownColor: '#ef5350',
          wickUpColor: '#26a69a', wickDownColor: '#ef5350'
        });

        volumeSeries = chart.addSeries(LightweightCharts.HistogramSeries, {
          priceFormat: { type: 'volume' },
          priceScaleId: '',
          lastValueVisible: false,
          priceLineVisible: false
        });
        volumeSeries.priceScale().applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });

        emaSeries = chart.addSeries(LightweightCharts.LineSeries, { color: '#f6c343', lineWidth: 2, crosshairMarkerVisible: false, lastValueVisible: false, priceLineVisible: false });
        bbUpper = chart.addSeries(LightweightCharts.LineSeries, { color: 'rgba(0, 188, 212, 0.6)', lineWidth: 1, crosshairMarkerVisible: false, lastValueVisible: false, priceLineVisible: false });
        bbMiddle = chart.addSeries(LightweightCharts.LineSeries, { color: 'rgba(0, 188, 212, 0.9)', lineWidth: 2, crosshairMarkerVisible: false, lastValueVisible: false, priceLineVisible: false });
        bbLower = chart.addSeries(LightweightCharts.LineSeries, { color: 'rgba(0, 188, 212, 0.6)', lineWidth: 1, crosshairMarkerVisible: false, lastValueVisible: false, priceLineVisible: false });

        stochK = chart.addSeries(LightweightCharts.LineSeries, { color: '#00E5FF', lineWidth: 1, priceScaleId: 'stoch', lastValueVisible: false, priceLineVisible: false });
        stochD = chart.addSeries(LightweightCharts.LineSeries, { color: '#FF9800', lineWidth: 1, priceScaleId: 'stoch', lastValueVisible: false, priceLineVisible: false });
        chart.priceScale('stoch').applyOptions({ scaleMargins: { top: 0.8, bottom: 0 }, visible: false });

        ready = true;
        chart.applyOptions({ width: el.clientWidth, height: el.clientHeight });
        window.addEventListener('resize', () => {
          chart.applyOptions({ width: el.clientWidth, height: el.clientHeight });
        });
      } catch (e) { report('init', e); }
    }

    function normalizeTime(t) {
      const n = Number(t);
      if (!n || isNaN(n)) return 0;
      return n > 10000000000 ? Math.floor(n / 1000) : Math.floor(n);
    }

    function calculateIndicators(data) {
        if (!data || data.length === 0) return;
        
        let emaData = [], bbUp = [], bbMid = [], bbLow = [];
        let rsiData = [], stochKData = [], stochDData = [];
        
        // EMA 20
        const emaPeriod = 20;
        let k = 2 / (emaPeriod + 1);
        let ema = data[0].c;
        
        // BB 20, 2
        const bbPeriod = 20;
        
        // StochRSI 14, 14, 3, 3
        const rsiPeriod = 14;
        const stochPeriod = 14;
        let gains = 0, losses = 0;
        
        for (let i = 0; i < data.length; i++) {
            const time = normalizeTime(data[i].t);
            if (!time) continue;
            
            // EMA
            if (i > 0) ema = (data[i].c - ema) * k + ema;
            emaData.push({ time, value: ema });
            
            // BB
            if (i >= bbPeriod - 1) {
                let sum = 0;
                for (let j = i - bbPeriod + 1; j <= i; j++) sum += data[j].c;
                let sma = sum / bbPeriod;
                let sumSq = 0;
                for (let j = i - bbPeriod + 1; j <= i; j++) sumSq += Math.pow(data[j].c - sma, 2);
                let stdDev = Math.sqrt(sumSq / bbPeriod);
                bbMid.push({ time, value: sma });
                bbUp.push({ time, value: sma + 2 * stdDev });
                bbLow.push({ time, value: sma - 2 * stdDev });
            }
            
            // RSI
            if (i > 0 && i <= rsiPeriod) {
                let diff = data[i].c - data[i-1].c;
                if (diff >= 0) gains += diff; else losses -= diff;
                if (i === rsiPeriod) {
                    let avgGain = gains / rsiPeriod, avgLoss = losses / rsiPeriod;
                    let rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
                    let rsiVal = avgLoss === 0 ? 100 : 100 - (100 / (1 + rs));
                    rsiData.push({ time, value: rsiVal, avgGain, avgLoss });
                }
            } else if (i > rsiPeriod) {
                let diff = data[i].c - data[i-1].c;
                let gain = Math.max(diff, 0), loss = Math.max(-diff, 0);
                let prev = rsiData[rsiData.length - 1];
                let avgGain = (prev.avgGain * (rsiPeriod - 1) + gain) / rsiPeriod;
                let avgLoss = (prev.avgLoss * (rsiPeriod - 1) + loss) / rsiPeriod;
                let rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
                let rsiVal = avgLoss === 0 ? 100 : 100 - (100 / (1 + rs));
                rsiData.push({ time, value: rsiVal, avgGain, avgLoss });
            }
        }
        
        // Stoch K
        let kValues = [];
        for (let i = 0; i < rsiData.length; i++) {
            if (i < stochPeriod - 1) {
                kValues.push(null);
                continue;
            }
            let minRsi = rsiData[i].value, maxRsi = rsiData[i].value;
            for (let j = i - stochPeriod + 1; j <= i; j++) {
                minRsi = Math.min(minRsi, rsiData[j].value);
                maxRsi = Math.max(maxRsi, rsiData[j].value);
            }
            let stochVal = (maxRsi - minRsi === 0) ? 0 : 100 * (rsiData[i].value - minRsi) / (maxRsi - minRsi);
            kValues.push(stochVal);
        }
        
        // Smooth K (3)
        let smoothedK = [];
        for (let i = 0; i < rsiData.length; i++) {
            if (kValues[i] === null || i < stochPeriod - 1 + 2) {
                smoothedK.push(null);
                continue;
            }
            let sum = 0;
            for (let j = i - 2; j <= i; j++) sum += kValues[j];
            let val = sum / 3;
            smoothedK.push(val);
            stochKData.push({ time: rsiData[i].time, value: val });
        }
        
        // Smooth D (3)
        for (let i = 0; i < rsiData.length; i++) {
            if (smoothedK[i] === null || i < stochPeriod - 1 + 2 + 2) continue;
            let sum = 0;
            for (let j = i - 2; j <= i; j++) sum += smoothedK[j];
            stochDData.push({ time: rsiData[i].time, value: sum / 3 });
        }
        
        emaSeries.setData(emaData);
        bbUpper.setData(bbUp);
        bbMiddle.setData(bbMid);
        bbLower.setData(bbLow);
        stochK.setData(stochKData);
        stochD.setData(stochDData);
    }


    function applyVisibility() {
      volumeSeries.applyOptions({ visible: currentConfig.volume });
      emaSeries.applyOptions({ visible: currentConfig.ema });
      bbUpper.applyOptions({ visible: currentConfig.bb });
      bbMiddle.applyOptions({ visible: currentConfig.bb });
      bbLower.applyOptions({ visible: currentConfig.bb });
      stochK.applyOptions({ visible: currentConfig.stoch });
      stochD.applyOptions({ visible: currentConfig.stoch });
      chart.priceScale('stoch').applyOptions({ visible: currentConfig.stoch });

      if (currentConfig.stoch) {
        candleSeries.priceScale().applyOptions({ scaleMargins: { top: 0.1, bottom: 0.25 } });
        if (currentConfig.volume) {
          volumeSeries.priceScale().applyOptions({ scaleMargins: { top: 0.8, bottom: 0.25 } });
        }
        chart.priceScale('stoch').applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
      } else {
        candleSeries.priceScale().applyOptions({ scaleMargins: { top: 0.1, bottom: 0.1 } });
        if (currentConfig.volume) {
          volumeSeries.priceScale().applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
        }
      }
    }

    function setIndicators(configStr) {
      try {
        currentConfig = (typeof configStr === 'string') ? JSON.parse(configStr) : configStr;
        applyVisibility();
      } catch (e) { report('setIndicators', e); }
    }

    // Lightweight Charts menolak data yang tidak terurut atau timestamp kembar.
    // Jadi data dirapikan dulu: dedupe per waktu, lalu urutkan naik.
    function setCandles(input) {
      if (!ready) return;
      try {
        const raw = (typeof input === 'string') ? JSON.parse(input) : input;
        if (!Array.isArray(raw) || raw.length === 0) return;

        const byTime = new Map();
        for (const c of raw) {
          const t = normalizeTime(c.t);
          if (!t || !(c.o > 0)) continue;
          byTime.set(t, { t: t, o: c.o, h: c.h, l: c.l, c: c.c, v: c.v || 0 });
        }
        const sorted = Array.from(byTime.values()).sort((a, b) => a.t - b.t);
        if (sorted.length === 0) return;
        currentRaw = sorted;

        candleSeries.setData(sorted.map(c => ({ time: c.t, open: c.o, high: c.h, low: c.l, close: c.c })));
        volumeSeries.setData(sorted.map(c => ({
          time: c.t,
          value: c.v,
          color: c.c >= c.o ? 'rgba(38,166,154,0.45)' : 'rgba(239,83,80,0.45)'
        })));

        calculateIndicators(currentRaw);
        applyVisibility();

        const total = sorted.length;
        if (total > 40) {
          chart.timeScale().setVisibleLogicalRange({ from: total - 40, to: total });
        } else {
          chart.timeScale().fitContent();
        }
      } catch (e) { report('setCandles', e); }
    }

    function updateLast(jsonStr) {
      if (!ready || currentRaw.length === 0) return;
      try {
        const c = (typeof jsonStr === 'string') ? JSON.parse(jsonStr) : jsonStr;
        const t = normalizeTime(c.t);
        if (!t || !(c.o > 0)) return;
        const last = currentRaw[currentRaw.length - 1];
        // Candle lebih tua dari yang terakhir akan ditolak library, jadi dilewati.
        if (t < last.t) return;

        candleSeries.update({ time: t, open: c.o, high: c.h, low: c.l, close: c.c });
        volumeSeries.update({
          time: t,
          value: c.v || 0,
          color: c.c >= c.o ? 'rgba(38,166,154,0.45)' : 'rgba(239,83,80,0.45)'
        });

        const normalized = { t: t, o: c.o, h: c.h, l: c.l, c: c.c, v: c.v || 0 };
        if (last.t === t) {
          currentRaw[currentRaw.length - 1] = normalized;
          if (!window._lastIndCalc || Date.now() - window._lastIndCalc > 1500) {
            window._lastIndCalc = Date.now();
            calculateIndicators(currentRaw);
          }
        } else {
          currentRaw.push(normalized);
          calculateIndicators(currentRaw);
        }
      } catch (e) { report('updateLast', e); }
    }

    function setLevels(input) {
      if (!ready || !candleSeries) return;
      try {
        const lv = (typeof input === 'string') ? JSON.parse(input) : input;
        priceLines.forEach(l => { try { candleSeries.removePriceLine(l); } catch (_) {} });
        priceLines = [];
        const add = (price, color) => {
          if (!price || price <= 0) return;
          priceLines.push(candleSeries.createPriceLine({
            price: price,
            color: color,
            lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dashed,
            axisLabelVisible: true,
            title: ''
          }));
        };
        add(lv.entry, '#00E5FF');
        add(lv.tp1, '#26a69a');
        add(lv.tp2, '#66BB6A');
        add(lv.sl, '#ef5350');
      } catch (e) { report('setLevels', e); }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
