name: Unit Tests (Manual)

# Hanya dijalankan manual: tab Actions → "Unit Tests (Manual)" → Run workflow.
# Tidak ada trigger push / pull_request.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Cakupan test'
        type: choice
        default: scalping-engine
        options:
          - scalping-engine   # engine.scalping + regime + indicators (offline, cepat)
          - all-engine        # seluruh agu.analys.engine.* (termasuk test live API Manta)
          - all-unit-tests    # semua unit test di app/
          - custom            # pakai kolom custom_filter
          - real-tokocrypto-replay  # uji engine pada candle NYATA Tokocrypto (butuh internet; hasil di branch real-data-reports)
          - probe-tokocrypto  # cek domain Tokocrypto mana yang bisa diakses dari runner GitHub (hasil di branch real-data-probe)
      custom_filter:
        description: 'Khusus scope=custom. Pola Gradle --tests, pisahkan koma. Contoh: agu.analys.engine.scalping.ScalpingRiskEngineTest'
        type: string
        required: false
        default: ''
      pairs:
        description: 'Khusus scope=real-tokocrypto-replay. Pair dipisah koma (format BTCUSDT).'
        type: string
        required: false
        default: 'BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,TRXUSDT'
      m1_pages:
        description: 'Khusus scope=real-tokocrypto-replay. Halaman M1 x1000 candle (5 = sekitar 3,5 hari).'
        type: string
        required: false
        default: '5'
      data_dir:
        description: 'Khusus scope=real-tokocrypto-replay. Folder CSV di repo (mode offline), mis. data/tokocrypto. Kosong = ambil langsung dari internet (diblokir 451 dari GitHub).'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Run unit tests
    if: ${{ inputs.scope != 'real-tokocrypto-replay' && inputs.scope != 'probe-tokocrypto' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Build test filter
        id: filter
        shell: bash
        env:
          SCOPE: ${{ inputs.scope }}
          CUSTOM_FILTER: ${{ inputs.custom_filter }}
        run: |
          case "$SCOPE" in
            scalping-engine)
              PATTERNS="agu.analys.engine.scalping.*,agu.analys.engine.regime.*,agu.analys.engine.indicators.*" ;;
            all-engine)
              PATTERNS="agu.analys.engine.*" ;;
            all-unit-tests)
              PATTERNS="" ;;
            custom)
              PATTERNS="$CUSTOM_FILTER"
              if [ -z "$PATTERNS" ]; then
                echo "::error::scope=custom membutuhkan custom_filter."
                exit 1
              fi ;;
            *)
              echo "::error::scope tidak dikenal: $SCOPE"
              exit 1 ;;
          esac

          ARGS=""
          IFS=',' read -ra ITEMS <<< "$PATTERNS"
          for p in "${ITEMS[@]}"; do
            p="$(echo "$p" | xargs)"
            [ -n "$p" ] && ARGS="$ARGS --tests \"$p\""
          done

          echo "patterns=${PATTERNS:-<semua>}" >> "$GITHUB_OUTPUT"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "Scope   : $SCOPE"
          echo "Filter  : ${PATTERNS:-<semua>}"

      - name: Run unit tests
        shell: bash
        run: |
          eval ./gradlew :app:testDebugUnitTest ${{ steps.filter.outputs.args }} --stacktrace --console=plain

      - name: Test summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          total = fail = err = skip = 0
          failed = []
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(f).getroot()
              total += int(r.get("tests", 0)); fail += int(r.get("failures", 0))
              err += int(r.get("errors", 0)); skip += int(r.get("skipped", 0))
              for tc in r.iter("testcase"):
                  if tc.find("failure") is not None or tc.find("error") is not None:
                      failed.append(f'{tc.get("classname")}.{tc.get("name")}')
          print("## Hasil Unit Test")
          print(f"- Cakupan: `${{ steps.filter.outputs.patterns }}`")
          print(f"- Total: **{total}** · Gagal: **{fail + err}** · Dilewati: **{skip}**")
          if failed:
              print("\n### Test gagal")
              for t in failed:
                  print(f"- `{t}`")
          elif total == 0:
              print("\n⚠️ Tidak ada test yang dijalankan (cek filter).")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  real-tokocrypto-replay:
    name: Real-data replay (Tokocrypto)
    if: ${{ inputs.scope == 'real-tokocrypto-replay' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # hanya untuk mendorong laporan ke branch real-data-reports

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Run real-data replay test
        env:
          RUN_REAL_TOKOCRYPTO_REPLAY: 'true'
          REAL_PAIRS: ${{ inputs.pairs }}
          REAL_M1_PAGES: ${{ inputs.m1_pages }}
          REAL_DATA_DIR: ${{ inputs.data_dir }}
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests "agu.analys.engine.scalping.replay.RealTokocryptoReplayTest" \
            --stacktrace --console=plain

      - name: Publish report
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT="app/build/real-data/real-tokocrypto-report.md"
          if [ ! -f "$REPORT" ]; then
            echo "Laporan tidak ditemukan." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p /tmp/rep && cp "$REPORT" /tmp/rep/real-tokocrypto-report.md
          cd /tmp/rep
          git init -q -b real-data-reports
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "report: real Tokocrypto replay (run ${GITHUB_RUN_ID})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" real-data-reports

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-tokocrypto-report
          path: app/build/real-data/
          if-no-files-found: warn
          retention-days: 14

  probe-tokocrypto:
    name: Probe akses Tokocrypto
    if: ${{ inputs.scope == 'probe-tokocrypto' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Probe endpoints
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/probe && cd /tmp/probe
          {
            echo "# Probe akses Tokocrypto dari runner GitHub"
            echo
            echo "IP runner: $(curl -sS -m 10 https://ipinfo.io/json | tr -d '\n' | head -c 300)"
            echo
            echo "| Endpoint | HTTP | Ukuran | Awal body |"
            echo "|---|---|---:|---|"
          } > probe.md
          probe() {
            local url="$1"
            local out; out=$(curl -sS -m 20 -A "Mozilla/5.0 TokoClient/3.5" -o body.tmp -w "%{http_code} %{size_download}" "$url" 2>&1 || true)
            local code="${out%% *}"; local size="${out##* }"
            local head; head=$(head -c 110 body.tmp 2>/dev/null | tr -d '\n|' )
            echo "| \`${url}\` | ${code} | ${size} | ${head} |" >> probe.md
          }
          probe "https://www.tokocrypto.com/open/v1/common/time"
          probe "https://www.tokocrypto.com/open/v1/common/symbols"
          probe "https://www.tokocrypto.com/open/v1/market/klines?symbol=BTC_USDT&interval=1m&limit=2"
          probe "https://www.tokocrypto.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=2"
          probe "https://www.tokocrypto.site/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=2"
          probe "https://www.tokocrypto.site/api/v3/time"
          probe "https://cloudme-toko.2meta.app/api/v1/klines?symbol=BTCUSDT&interval=1m&limit=2"
          probe "https://cloudme-toko.2meta.app/api/v1/time"
          cat probe.md >> "$GITHUB_STEP_SUMMARY"
          rm -f body.tmp
          git init -q -b real-data-probe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "probe: akses Tokocrypto dari runner (run ${GITHUB_RUN_ID})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" real-data-probe
