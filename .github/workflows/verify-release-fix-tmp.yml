name: Verify Release Fix (sementara)

# Workflow sementara untuk membuktikan perbaikan R8 rilis 41721008218.
# Dihapus setelah bukti tercatat di docs/LAPORAN-integrasi-agent-bridge-v2-2026-11-03.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-release-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-r8:
    name: Build rilis (bukti R8) dan cek dependensi
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 belum diatur!"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --console=plain

      - name: Cek APK rilis benar-benar terbentuk
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK" && test -f "$APK"
          ls -l "$APK"

      - name: Cek Netty sudah tidak ada di classpath rilis
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console=plain > "$RUNNER_TEMP/deps.txt"
          if grep -i 'netty' "$RUNNER_TEMP/deps.txt"; then
            echo "::error::Netty masih ada di releaseRuntimeClasspath"
            exit 1
          fi
          echo "Netty tidak ada di releaseRuntimeClasspath."
          grep -i 'ktor-server-cio' "$RUNNER_TEMP/deps.txt"

  bridge-smoke:
    name: Smoke server bridge nyata (HTTP, WebSocket, SSE, restart)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14 untuk proyek smoke
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Jalankan smoke dengan sumber AgentHttpServer.kt asli
        working-directory: tools/bridge-smoke
        run: gradle run --no-daemon --stacktrace --console=plain

      - name: Bersihkan hasil build smoke
        if: always()
        run: rm -rf tools/bridge-smoke/build tools/bridge-smoke/.gradle
