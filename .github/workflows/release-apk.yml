name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8 -Xmx4g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Write .env for secrets plugin
        run: |
          # Always write quoted values so BuildConfig gets valid Java ("" not blank)
          # GROQ/DEEPSEEK are also ignoreListed in app/build.gradle.kts (prefs-only)
          printf 'GROQ_API_KEY="%s"\nGEMINI_API_KEY="%s"\nDEEPSEEK_API_KEY="%s"\n' \
            "${{ secrets.GROQ_API_KEY }}" \
            "${{ secrets.GEMINI_API_KEY }}" \
            "${{ secrets.DEEPSEEK_API_KEY }}" > .env
          echo "--- .env (keys redacted) ---"
          sed 's/=.*/=***/' .env

      - name: Assemble Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        run: |
          find app/build/outputs/apk -name "*.apk" -ls
          test -n "$(find app/build/outputs/apk -name '*.apk' | head -1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-apk
          name: Release v${{ github.run_number }}
          body: |
            Automated installable APK from main.
            Signed with debug keystore for sideload.
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
