name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8 -Xmx4g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Write .env for secrets plugin
        run: |
          # Always write quoted values so BuildConfig gets valid Java ("" not blank)
          # GROQ/DEEPSEEK are also ignoreListed in app/build.gradle.kts (prefs-only)
          printf 'GROQ_API_KEY="%s"\nGEMINI_API_KEY="%s"\nDEEPSEEK_API_KEY="%s"\n' \
            "${{ secrets.GROQ_API_KEY }}" \
            "${{ secrets.GEMINI_API_KEY }}" \
            "${{ secrets.DEEPSEEK_API_KEY }}" > .env
          echo "--- .env (keys redacted) ---"
          sed 's/=.*/=***/' .env

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/analisa-pasar-release.jks"
          test -s "$RUNNER_TEMP/analisa-pasar-release.jks"
          echo "Release keystore restored in runner temp directory."

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Assemble Release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/analisa-pasar-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace -PVERSION_CODE=${{ github.run_number }}

      - name: Verify APK metadata
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          echo "APK: $APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-apk
          name: Release v${{ github.run_number }}
          body: |
            Automated installable APK from main.
            Signed with the persistent release keystore from GitHub Actions Secrets.
            Android versionCode: ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
