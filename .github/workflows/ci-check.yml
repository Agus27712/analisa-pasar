name: CI Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Compile Debug Kotlin
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No Gradle Wrapper in repo — pin Gradle for AGP 9.1.x
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Compile Debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace
