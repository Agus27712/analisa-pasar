name: Engine Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/agu/analys/engine/**'
      - 'app/src/main/java/agu/analys/viewmodel/**'
      - 'app/src/main/java/agu/analys/model/**'
      - 'app/src/main/java/agu/analys/service/**'
      - 'app/src/test/**'
      - 'app/build.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  verify:
    name: Unit Test & Compile
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8 -Xmx4g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Run engine unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
