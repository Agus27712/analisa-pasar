name: Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          VERSION_CODE=$(sed -n 's/.*getOrElse(\([0-9]*\)).*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ steps.version.outputs.name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          EXPECTED_TAG="v${{ steps.version.outputs.name }}"
          test "$TAG" = "$EXPECTED_TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease

      - name: Prepare release notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          TAG="${{ steps.release_tag.outputs.tag }}"
          
          # Pastikan semua tag di-fetch dari remote agar komparasi akurat
          git fetch --tags --force origin 2>/dev/null || true
          
          # Cari tag rilis sebelumnya (format vX.Y.Z) yang bukan tag rilis saat ini
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+' | grep -v "^$TAG$" | head -n 1 || true)
          
          if [ -n "$PREVIOUS_TAG" ] && git rev-parse -q --verify "refs/tags/$PREVIOUS_TAG" >/dev/null 2>&1; then
            echo "Membandingkan perubahan sejak rilis sebelumnya: $PREVIOUS_TAG..$TAG"
            RANGE="$PREVIOUS_TAG..HEAD"
            FEATS=$(git log $RANGE --no-merges --pretty=format:'- %s' --grep='^feat' -i || true)
            FIXES=$(git log $RANGE --no-merges --pretty=format:'- %s' --grep='^fix' -i || true)
            OTHERS=$(git log $RANGE --no-merges --pretty=format:'- %s' --grep='^\(feat\|fix\)' -i --invert-grep || true)
          else
            echo "Tag rilis sebelumnya tidak ditemukan. Mengambil hanya commit terbaru (max 10 commit)."
            FEATS=$(git log -n 10 --no-merges --pretty=format:'- %s' --grep='^feat' -i || true)
            FIXES=$(git log -n 10 --no-merges --pretty=format:'- %s' --grep='^fix' -i || true)
            OTHERS=$(git log -n 10 --no-merges --pretty=format:'- %s' --grep='^\(feat\|fix\)' -i --invert-grep || true)
          fi

          [ -n "$FEATS" ] || FEATS="- Pembaruan fitur dan optimasi aplikasi."
          [ -n "$FIXES" ] || FIXES="- Perbaikan stabilitas dan konsistensi sistem."
          [ -n "$OTHERS" ] || OTHERS="- Peningkatan performa dan sinkronisasi data."

          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## Versi
          **v$VERSION** (Build ${{ steps.version.outputs.code }})

          ## Fitur & Pembaruan
          $FEATS

          ## Perbaikan Bug
          $FIXES

          ## Peningkatan Sistem
          $OTHERS
          EOF

      - name: Create GitHub release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          TAG="${{ steps.release_tag.outputs.tag }}"
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Stop to avoid replacing a published release."
            exit 1
          fi
          gh release create "$TAG" "$APK" --title "Analysis Pasar v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --target "${GITHUB_SHA}"
