name: Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/.*getOrElse(\([0-9]*\)).*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="3.3.9"
          fi
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE="75"
          fi
          echo "Detected Version Name: $VERSION_NAME"
          echo "Detected Version Code: $VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${{ steps.version.outputs.name }}"
          fi
          echo "Resolved Tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 belum diatur di GitHub Secrets!"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          if [ ! -s "$RUNNER_TEMP/release.keystore" ]; then
            echo "::error::Gagal mendekode release.keystore dari secret!"
            exit 1
          fi

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease -x test -x testReleaseUnitTest -x testDebugUnitTest -x lint -x lintVitalRelease --no-daemon --stacktrace

      - name: Locate APK
        id: locate_apk
        shell: bash
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::APK file not found in app/build/outputs/apk/release!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          CODE="${{ steps.version.outputs.code }}"
          TAG="${{ steps.release_tag.outputs.tag }}"
          
          # Fetch remote tags for clean comparison
          git fetch --tags --force origin 2>/dev/null || true
          
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+' | grep -v "^$TAG$" | head -n 1 || true)
          
          if [ -n "$PREVIOUS_TAG" ] && git rev-parse -q --verify "refs/tags/$PREVIOUS_TAG" >/dev/null 2>&1; then
            RANGE="$PREVIOUS_TAG..HEAD"
          else
            RANGE="HEAD~10..HEAD"
            if ! git rev-parse -q --verify "$RANGE" >/dev/null 2>&1; then
              RANGE="HEAD"
            fi
          fi

          # Extract and clean commit lines (no merge commits, unique, concise)
          FEATS=$(git log $RANGE --no-merges --pretty=format:'- %s' --grep='^feat' -i 2>/dev/null | sed -E 's/^- [fF]eat(\([^)]+\))?:? /- /g' | sort -u || true)
          FIXES=$(git log $RANGE --no-merges --pretty=format:'- %s' --grep='^fix' -i 2>/dev/null | sed -E 's/^- [fF]ix(\([^)]+\))?:? /- /g' | sort -u || true)
          OTHERS=$(git log $RANGE --no-merges --pretty=format:'- %s' --grep='^\(feat\|fix\)' -i --invert-grep 2>/dev/null | sed -E 's/^- [a-zA-Z0-9_-]+(\([^)]+\))?:? /- /g' | grep -v -i -E '(merge|bump version|update version|chore:)' | sort -u || true)

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          {
            echo "## Analysis Pasar v$VERSION"
            echo ""

            HAS_CONTENT=false

            if [ -n "$FEATS" ]; then
              echo "### ✨ Fitur Baru"
              echo "$FEATS"
              echo ""
              HAS_CONTENT=true
            fi

            if [ -n "$FIXES" ]; then
              echo "### 🛠️ Perbaikan Bug"
              echo "$FIXES"
              echo ""
              HAS_CONTENT=true
            fi

            if [ -n "$OTHERS" ]; then
              echo "### ⚡ Peningkatan & Perubahan Lainnya"
              echo "$OTHERS"
              echo ""
              HAS_CONTENT=true
            fi

            if [ "$HAS_CONTENT" = false ]; then
              RECENT_ALL=$(git log -n 5 --no-merges --pretty=format:'- %s' 2>/dev/null | grep -v -i -E '(merge|bump version)' | sort -u || true)
              if [ -n "$RECENT_ALL" ]; then
                echo "### 📝 Ringkasan Perubahan"
                echo "$RECENT_ALL"
                echo ""
              else
                echo "- Pembaruan dan peningkatan performa rilis v$VERSION."
                echo ""
              fi
            fi
          } > "$NOTES_FILE"

      - name: Create or update GitHub release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          TAG="${{ steps.release_tag.outputs.tag }}"
          APK="${{ steps.locate_apk.outputs.apk_path }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Updating existing release notes and asset..."
            gh release edit "$TAG" --title "Analysis Pasar v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$TAG" "$APK" --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$APK" --title "Analysis Pasar v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --target "${GITHUB_SHA}"
          fi
