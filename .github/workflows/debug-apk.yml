name: Debug Code

on:
  push:
    branches:
      - backup

permissions:
  contents: read

# Jangan antrekan banyak debug untuk commit lama.
# Jika ada push baru saat debug berjalan, yang lama dibatalkan.
concurrency:
  group: debug-code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-code:
    name: Compile Debug Code
    runs-on: ubuntu-latest

    steps:
      # KUNCI: selalu checkout branch tempat workflow dijalankan.
      # Push ke backup -> validasi kode backup.
      - name: Checkout workflow branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Verify source
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHA="$(git rev-parse --short HEAD)"
          MSG="$(git log -1 --pretty=%s)"
          echo "========================================"
          echo " DEBUG SOURCE (locked to workflow ref)"
          echo " Branch : $BRANCH"
          echo " Commit : $SHA"
          echo " Message: $MSG"
          echo " Ref    : $GITHUB_REF"
          echo "========================================"
          test "$BRANCH" = "backup"
          test -n "$SHA"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fokus hanya validasi kode Kotlin/Compose.
      # Tidak membuat APK dan tidak upload artifact.
      - name: Compile debug code
        run: ./gradlew :app:compileDebugKotlin --stacktrace
