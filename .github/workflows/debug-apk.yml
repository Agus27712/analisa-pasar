name: Debug Code

on:
  push:
    branches:
      - backup
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-code:
    name: Compile Debug Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v4

      - name: Verify source
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHA="$(git rev-parse --short HEAD)"
          MSG="$(git log -1 --pretty=%s)"
          echo "========================================"
          echo " DEBUG SOURCE (locked to workflow ref)"
          echo " Branch : $BRANCH"
          echo " Commit : $SHA"
          echo " Message: $MSG"
          echo " Ref    : $GITHUB_REF"
          echo "========================================"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Compile debug code
        run: ./gradlew :app:compileDebugKotlin --stacktrace
