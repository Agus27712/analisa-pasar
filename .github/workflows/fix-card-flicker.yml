name: Fix Analysis Card Flicker
on:
  push:
    branches: [feature/hot-coins-live]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hot-coins-live
          fetch-depth: 1
      - name: Patch live engine refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/agu/analys/engine/LearningTradingEngine.kt')
          s = p.read_text()
          old = '''    fun resetForOffline() {\n        currentTick = null\n        mtfRefreshJob?.cancel()\n        mtfRefreshJob = null\n        lastMtfRefresh = 0L\n        mtfSymbol = ""\n        h1Candles = emptyList()\n        m15Candles = emptyList()\n        m1Candles = emptyList()\n        synchronized(candles) { candles.clear() }\n        _indicators.value = TechnicalIndicators()\n        _signalState.value = AISignalState('''
          new = '''    fun resetForOffline(preserveState: Boolean = false) {\n        currentTick = null\n        mtfRefreshJob?.cancel()\n        mtfRefreshJob = null\n        lastMtfRefresh = 0L\n        mtfSymbol = ""\n        h1Candles = emptyList()\n        m15Candles = emptyList()\n        m1Candles = emptyList()\n        synchronized(candles) { candles.clear() }\n        // Do not publish an empty state during a live refresh. The UI observes\n        // these flows directly, so clearing them creates a visible card flash.\n        if (preserveState) return\n        _indicators.value = TechnicalIndicators()\n        _signalState.value = AISignalState('''
          if old not in s: raise SystemExit('reset block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('app/src/main/java/agu/analys/viewmodel/TradingViewModel.kt')
          s = p.read_text()
          old = '''                            _recentCandles.value = candles\n                            engine.resetForOffline()\n                            engine.onTickUpdate(normalizedTick)\n                            candles.forEach { engine.onCandleUpdate(it) }'''
          new = '''                            _recentCandles.value = candles\n                            // Preserve the last valid analysis snapshot while the new\n                            // candle set is being processed, avoiding card flicker.\n                            engine.resetForOffline(preserveState = true)\n                            engine.onTickUpdate(normalizedTick)\n                            candles.forEach { engine.onCandleUpdate(it) }'''
          if old not in s: raise SystemExit('live refresh block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-card-flicker.yml
          git add app/src/main/java/agu/analys/engine/LearningTradingEngine.kt app/src/main/java/agu/analys/viewmodel/TradingViewModel.kt .github/workflows/fix-card-flicker.yml
          git commit -m 'fix: prevent analysis cards from flickering during live refresh'
          git push origin HEAD:feature/hot-coins-live
