name: Temp Scalping Debug Build
on:
  push:
    branches: [feature/hot-coins-live]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hot-coins-live
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/temp-scalping-debug-build.yml
          git add .github/workflows/temp-scalping-debug-build.yml
          git commit -m 'chore: remove temporary debug build workflow'
          git push origin HEAD:feature/hot-coins-live
